{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container">
    <h2>Notifications</h2>
    <ul id="notification-list"></ul>
</div>

<script>
async function loadNotifications() {
    try {
        // 1. Call the backend API
        const res = await fetch("{% url 'notifications_api' %}");
        const notifications = await res.json();

        // 2. Select the <ul> list
        const list = document.getElementById("notification-list");
        list.innerHTML = "";

        // 3. Loop through notifications and display
        notifications.forEach(n => {
            const li = document.createElement("li");
            li.textContent = `${n.message} — ${new Date(n.timestamp).toLocaleString()}`;

            // Make unread bold
            li.style.fontWeight = n.read ? "normal" : "bold";

            // Mark as read when clicked
            li.onclick = async () => {
                await fetch(`/dashboard/notifications/mark-read/${n.id}/`, {
                    method: "POST",
                    headers: {
                        "X-CSRFToken": getCookie("csrftoken")
                    }
                });
                li.style.fontWeight = "normal";
            };

            list.appendChild(li);
        });

    } catch (err) {
        console.error("Error loading notifications:", err);
    }
}

// Helper to get CSRF token (needed for POST)
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
        const cookies = document.cookie.split(";");
        for (let cookie of cookies) {
            cookie = cookie.trim();
            if (cookie.startsWith(name + "=")) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

// Load when page opens
loadNotifications();
</script>
{% endblock %}
