<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}My Site{% endblock %}</title>
    {% comment %} <link rel="stylesheet" href="{% static 'css/style.css' %}"> {% endcomment %}
</head>
<body>
    <!-- Navbar -->
    <nav>
        <a href="/">Home</a> |
        <a href="{% url 'clubs:club_list' %}">Clubs</a> |
        {% if user.is_authenticated %}
            Hello, {{ user.username }} |
            <a href="{% url 'logout' %}">Logout</a>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
        {% endif %}
    </nav>

    <hr>

    <!-- Content area -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <hr>

    <!-- Footer -->
    <footer>
        <p>&copy; {{ year|default:2025 }} My Django App</p>
    </footer>
</body>
</html>
