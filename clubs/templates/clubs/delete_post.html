{% extends "clubs/base.html" %}
{% block title %}Delete Post — {{ club.name }}{% endblock %}
{% block content %}
  <h1>Delete Post</h1>
  <p>Are you sure you want to delete "<strong>{{ post.title }}</strong>"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{{ club.get_absolute_url }}">Cancel</a>
  </form>
{% endblock %}
